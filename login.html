{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="card" style="max-width:440px;margin:0 auto">
  <h1>Log in</h1>
  {% if error %}<div class="alert err">{{ error }}</div>{% endif %}
  <form method="post"><input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <p><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="username"></p>
    <p><label for="password">Password</label><input id="password" name="password" type="password" required autocomplete="current-password"></p>
    <p><button>Log in</button></p>
  </form>
  <p class="note">No account? <a href="{{ url_for('register') }}">Register</a></p>
</div>
{% endblock %}
