{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="card" style="max-width:440px;margin:0 auto">
  <h1>Create an account</h1>
  {% if error %}<div class="alert err">{{ error }}</div>{% endif %}
  <form method="post"><input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <p><label for="full_name">Full name</label><input id="full_name" name="full_name" required maxlength="100" value="{{ form.get('full_name','') }}"></p>
    <p><label for="email">Email</label><input id="email" name="email" type="email" required maxlength="150" value="{{ form.get('email','') }}"></p>
    <p><label for="password">Password (min. 8 characters)</label><input id="password" name="password" type="password" minlength="8" required autocomplete="new-password"></p>
    <p><label for="role">I am a</label><select id="role" name="role"><option value="buyer">Buyer / owner</option><option value="agent">Real estate agent</option></select></p>
    <p><button>Register</button></p>
  </form>
</div>
{% endblock %}
